$kind: http-request
name: Reset Password
method: POST
url: 'http://localhost:8082/api/v1/auth/reset-password'
body:
  type: formdata
  content:
    - key: email
      type: text
      value: 'admin@example.com'
    - key: otp
      type: text
      value: '{{resetOtp}}'
    - key: newPassword
      type: text
      value: 'admin123'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response confirms password reset", function () {
          pm.expect(pm.response.text()).to.include("Password reset successful");
      });

      pm.test("Response time is under 3000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
