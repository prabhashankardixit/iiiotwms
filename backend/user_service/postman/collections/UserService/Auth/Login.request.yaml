$kind: http-request
method: POST
url: http://localhost:8082/api/v1/auth/login
headers:
  - key: Origin
    value: http://localhost:3000
    disabled: true
body:
  type: json
  content: "{\r

    \  \"email\": \"psdixit85@gmail.com\",\r

    \  \"password\": \"psdixit85\"\r

    }"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response contains a JWT token", function () {
          const token = pm.response.text();
          pm.expect(token).to.be.a("string").and.to.match(/^[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+$/);
      });

      pm.test("Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      // Store the token for downstream requests
      if (pm.response.code === 200) {
          pm.collectionVariables.set("authToken", pm.response.text());
      }
    language: text/javascript
