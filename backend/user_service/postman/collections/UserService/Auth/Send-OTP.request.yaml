$kind: http-request
name: Send OTP
method: POST
url: 'http://localhost:8082/api/v1/auth/send-otp'
body:
  type: formdata
  content:
    - key: email
      type: text
      value: 'admin@example.com'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response confirms OTP sent", function () {
          pm.expect(pm.response.text()).to.include("OTP sent");
      });

      pm.test("Response time is under 5000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
